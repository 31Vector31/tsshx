<!doctype html>
<html><head><meta charset="utf-8"><title>drag</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 12px system-ui, "Segoe UI", sans-serif; }
  .chip { display: flex; align-items: center; gap: 7px; height: 26px; margin: 2px; padding: 0 12px 0 10px; border-radius: 4px; border: 1px solid rgba(127,127,127,.45); box-shadow: 0 4px 14px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .92; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
</style></head>
<body><div class="chip"><span class="dot"></span><span class="t"></span></div>
<script>
  const q = new URLSearchParams(location.search);
  const chip = document.querySelector('.chip'), dot = document.querySelector('.dot');
  chip.style.background = q.get('bg') || '#202329'; chip.style.color = q.get('fg') || '#d4d7dd';
  document.querySelector('.t').textContent = q.get('title') || '';
  if (q.get('color')) dot.style.background = q.get('color'); else dot.remove();
</script></body></html>
